[package]
name = "groth16-ckb-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Standalone workspace so the nightly toolchain pinned in rust-toolchain.toml
# is scoped to fuzzing only; host and script workspaces stay on stable.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
verifier-core = { path = "../script/crates/verifier-core" }
wire-decode = { path = "../script/crates/wire-decode" }

[[bin]]
name = "verify_arkworks"
path = "fuzz_targets/verify_arkworks.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_vk_molecule"
path = "fuzz_targets/decode_vk_molecule.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_witness_molecule"
path = "fuzz_targets/decode_witness_molecule.rs"
test = false
doc = false
bench = false
